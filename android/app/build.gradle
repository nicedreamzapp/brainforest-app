plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.brainforest.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.brainforest.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // Voice pack is already-compressed AAC (.m4a); storing (not deflating) keeps
    // the APK small AND lets MediaPlayer read the asset via a file descriptor.
    androidResources {
        noCompress += ['m4a', 'json']
    }

    buildTypes {
        debug {
            // keep default debuggable
        }
        release {
            // Play requires >=25% DEX coverage from Feb 2027; false is 0%.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
