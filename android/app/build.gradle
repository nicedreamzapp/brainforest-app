plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.brainforest.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.brainforest.app"
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName "1.7"
    }

    // Voice pack is already-compressed AAC (.m4a); storing (not deflating) keeps
    // the APK small AND lets MediaPlayer read the asset via a file descriptor.
    androidResources {
        noCompress += ['m4a', 'json']
    }

    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file('keystore.properties')
            if (f.exists()) {
                f.withInputStream { props.load(it) }
                storeFile file(props.getProperty('storeFile'))
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias')
                keyPassword props.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            // keep default debuggable
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.android.billingclient:billing-ktx:8.0.0'
}
