<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Brainforest · Parent Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, sans-serif;
    /* near-black slate + white text; green is an ACCENT, never a text-on-green pair */
    background: #14181c; color: #f5f7f6; margin: 0;
    padding: calc(18px + env(safe-area-inset-top))
             max(16px, env(safe-area-inset-right))
             calc(24px + env(safe-area-inset-bottom))
             max(16px, env(safe-area-inset-left));
  }
  h1 { color: #ffffff; margin: 0 0 6px; font-size: clamp(20px, 5.5vw, 30px); }
  h3 { margin: 0 0 12px; color: #8be5b5; font-size: 16px; text-transform: uppercase; letter-spacing: 0.8px; }
  .sub { color: #aab8b1; margin: 0 0 16px; font-size: 13px; }
  .card {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
  }
  .kid-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .kid-tab {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18);
    color: #f5f7f6; border-radius: 999px; padding: 8px 16px; font-size: 14px;
    cursor: pointer; font-family: inherit;
  }
  .kid-tab.active { background: #ffffff; color: #14181c; font-weight: 700; }

  /* KPI stats: a real grid so every block is even, 3-up on phones */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (min-width: 700px) { .kpis { grid-template-columns: repeat(6, 1fr); } }
  .stat {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px; padding: 12px 8px; text-align: center; min-width: 0;
  }
  .stat .num { font-size: clamp(18px, 5vw, 26px); font-weight: 800; color: #ffffff; line-height: 1.1; overflow-wrap: anywhere; }
  .stat .lbl { font-size: 10px; color: #9fb0a7; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.6px; }

  /* Mastery: stacked rows, no table — nothing to squish or cut off */
  .skill-row { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .skill-row:last-child { border-bottom: 0; }
  .skill-top { display: flex; align-items: center; gap: 10px; }
  .skill-name { font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .bar { background: rgba(255,255,255,0.10); height: 10px; border-radius: 5px; overflow: hidden; flex: 2; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #22a877, #7fe8b1); }
  .pct { font-variant-numeric: tabular-nums; color: #ffffff; width: 44px; text-align: right; font-weight: 700; font-size: 14px; }
  .skill-sub { font-size: 12px; color: #9fb0a7; margin-top: 4px; }

  .session-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 13px; }
  .session-row:last-child { border-bottom: 0; }
  .session-when { color: #f5f7f6; }
  .session-meta { color: #9fb0a7; white-space: nowrap; }
  .empty { color: #9fb0a7; font-size: 13px; padding: 6px 0; }
  a.back {
    display: inline-block; margin-top: 6px; color: #7fe8b1; font-weight: 600;
    text-decoration: none; border: 1px solid rgba(127,232,177,0.4);
    border-radius: 999px; padding: 10px 18px;
  }
  /* Rating ask, grown-ups only (Kids category: behind a parental gate) */
  .rate-gate { position: fixed; inset: 0; background: rgba(8,10,12,0.78); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .rate-card { background: #1d2328; border: 1px solid rgba(255,255,255,0.16); border-radius: 16px;
    padding: 20px; width: min(360px, 100%); text-align: center; }
  .rate-card h3 { margin-bottom: 8px; }
  .rate-card p { color: #cfd8d3; font-size: 14px; margin: 0 0 12px; }
  .rate-card input { width: 120px; font-size: 22px; text-align: center; padding: 8px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.3); background: #14181c; color: #fff; font-family: inherit; }
  .rate-row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
  .rate-row button { font-family: inherit; font-size: 15px; font-weight: 700; border-radius: 999px;
    padding: 10px 18px; cursor: pointer; border: 1px solid rgba(127,232,177,0.5); }
  .rate-ok { background: #7fe8b1; color: #14181c; }
  .rate-no { background: transparent; color: #7fe8b1; }
</style>
</head>
<body>
<h1>🌳 Brainforest · Parent Dashboard</h1>
<p class="sub" id="sub">Loading…</p>
<div class="kid-tabs" id="kid-tabs"></div>

<div class="card"><div class="kpis" id="kpis"></div></div>

<div class="card">
  <h3>Skill Mastery</h3>
  <div id="mastery-list"><p class="empty">No practice yet — go play!</p></div>
</div>

<div class="card">
  <h3>Recent Sessions</h3>
  <div id="sessions-list"><p class="empty">No sessions yet.</p></div>
</div>

<div class="card" id="forever-card" style="display:none">
  <h3>Brainforest Forever</h3>
  <p class="sub" style="margin-bottom:12px">One-time unlock — no subscription, no ads. Every kid on this device, forever.</p>
  <a class="back" style="margin-top:0" href="index.html#unlock">Unlock Brainforest Forever</a>
</div>

<a class="back" href="index.html">← Back to Brainforest</a>

<script src="engine.js?v=bf1"></script>
<script>
const kvGet = k => (window.BF ? BF.kv.get(k) : localStorage.getItem(k));
const kvSet = (k, v) => (window.BF ? BF.kv.set(k, v) : localStorage.setItem(k, v));
const pretty = s => String(s).replace(/^math_/, "").replace(/_/g, " ")
  .replace(/\b\w/g, c => c.toUpperCase());

async function buildTabs() {
  const j = await (await fetch("/api/kids")).json();
  const tabs = document.getElementById("kid-tabs");
  const current = kvGet("kid") || (j.kids[0] && j.kids[0].id);
  tabs.innerHTML = "";
  j.kids.forEach(k => {
    const b = document.createElement("button");
    b.className = "kid-tab" + (k.id === current ? " active" : "");
    b.textContent = `${k.emoji} ${k.name} · ${k.grade === 0 ? "K" : (k.grade_label || k.grade)}`;
    b.addEventListener("click", () => { kvSet("kid", k.id); buildTabs(); load(); });
    tabs.appendChild(b);
  });
  const cur = j.kids.find(k => k.id === current);
  document.getElementById("sub").textContent = cur
    ? `Showing ${cur.name}. Tap another kid to switch. Everything is stored on this phone only.`
    : "No kids yet — add one in the app first.";
}

const SKILL_NAMES = {
  math_count: "Counting", math_add: "Adding", math_sub: "Taking Away", math_groups: "Groups Of",
  math_skip: "Skip Counting", math_place_value: "Place Value", math_shapes: "Shapes",
  math_mult: "Multiplying", math_div: "Dividing", math_fractions: "Fractions",
  math_decimals: "Decimals", math_word: "Word Problems", math_geom: "Geometry",
  money: "Money", time: "Telling Time", letters: "Letters", writing_letter: "Letter Tracing",
  phonics_cvc: "Sounding Out", sight_words: "Sight Words", reading_fluency: "Reading Fluency",
  reading_comp: "Reading", spell: "Spelling", vocab: "Vocabulary", grammar: "Grammar",
  science: "Science", social: "Our World", sel: "Big Feelings",
};
const THEME_NAMES = { unicorns: "unicorns", mermaids: "mermaids", dinos: "dinosaurs",
  space: "space", cats: "cats", horses: "horses", bluey: "puppies" };

async function load() {
  const m = await (await fetch("/api/mastery")).json();
  const col = await (await fetch("/api/collection")).json();
  // Fresh install with no kids yet: show a friendly empty state, never crash.
  const mastery = Array.isArray(m.mastery) ? m.mastery : [];
  if (col.error) { col.quests_done = 0; }
  const totalAttempts = mastery.reduce((a, b) => a + b.attempts, 0);
  const totalCorrect = mastery.reduce((a, b) => a + b.correct, 0);
  // Mastered means a real track record, not one lucky answer: 8+ tries and a
  // strong recent score. (1/1 used to show as "mastered, 100%".)
  const isMastered = x => x.score >= 0.85 && x.attempts >= 8;
  const mastered = mastery.filter(isMastered).length;
  let labels = {};
  try { (await (await fetch("/api/path")).json()).nodes.forEach(n => { labels[n.key] = n.label; }); } catch (_) {}
  const nice = k => labels[k] || SKILL_NAMES[k] || pretty(k);
  document.getElementById("kpis").innerHTML = `
    <div class="stat"><div class="num">${totalAttempts}</div><div class="lbl">Attempts</div></div>
    <div class="stat"><div class="num">${totalCorrect}</div><div class="lbl">Correct</div></div>
    <div class="stat"><div class="num">${totalAttempts ? Math.round(100 * totalCorrect / totalAttempts) : 0}%</div><div class="lbl">Accuracy</div></div>
    <div class="stat"><div class="num">${mastery.length}</div><div class="lbl">Skills tried</div></div>
    <div class="stat"><div class="num">${mastered}</div><div class="lbl">Mastered</div></div>
    <div class="stat"><div class="num">${col.quests_done || 0}</div><div class="lbl">Quests done</div></div>
  `;
  const list = document.getElementById("mastery-list");
  if (mastery.length) {
    list.innerHTML = "";
    const acc = r => r.attempts ? r.correct / r.attempts : 0;
    mastery.sort((a, b) => acc(b) - acc(a) || b.attempts - a.attempts).forEach(r => {
      // The bar and the % now match the "x/y correct" line under them.
      const pct = Math.round(acc(r) * 100);
      const last = r.last_seen ? new Date(r.last_seen).toLocaleDateString() : "—";
      list.insertAdjacentHTML("beforeend", `
        <div class="skill-row">
          <div class="skill-top">
            <span class="skill-name">${nice(r.skill)}</span>
            <div class="bar"><div style="width:${pct}%"></div></div>
            <span class="pct">${pct}%</span>
          </div>
          <div class="skill-sub">${r.correct}/${r.attempts} correct${isMastered(r) ? " · mastered" : (r.attempts < 8 ? " · just getting started" : "")} · last practiced ${last}</div>
        </div>`);
    });
  }
  const sess = await (await fetch("/api/sessions")).json().catch(() => ({}));
  const sl = document.getElementById("sessions-list");
  if (sess.sessions && sess.sessions.length) {
    sl.innerHTML = "";
    sess.sessions.forEach(s => {
      const when = new Date(s.started_at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      sl.insertAdjacentHTML("beforeend", `
        <div class="session-row">
          <span class="session-when">${when}</span>
          <span class="session-meta">${THEME_NAMES[s.theme] || s.theme || "—"} · ${s.activities_done} ${s.activities_done === 1 ? "activity" : "activities"} · ${s.minutes} min</span>
        </div>`);
    });
  }
}

if (kvGet("bf_owned") !== "1") {
  document.getElementById("forever-card").style.display = "";
}

(async () => { await buildTabs(); await load(); })().catch(e => {
  document.getElementById("sub").textContent = "Couldn't load data: " + e;
});

// ---- Rating ask: grown-ups only ----
// Brainforest is in the Kids category, so the store's rating prompt sits behind
// the same kind of grown-ups question as the purchase. It is offered here, on the
// parent dashboard, only after 3+ quests were finished on this device (app.js
// noteQuestForRating) and at most once every 60 days. A wrong answer or "Not now"
// also starts the 60 days. The native shell (bfReview) calls the store's own
// prompt (StoreKit on iPhone, Play In-App Review on Android); the store decides
// whether it actually appears.
(function ratingAsk() {
  const bridge = window.webkit && webkit.messageHandlers && webkit.messageHandlers.bfReview;
  if (!bridge) return;
  const quests = Number(kvGet("bf_rate_quests") || 0);
  const last = Number(kvGet("bf_rate_last") || 0);
  if (quests < 3 || Date.now() - last < 60 * 86400e3) return;
  const QS = [["What is 7 × 8 + 6?", 62], ["What is 9 × 6 + 7?", 61],
              ["What is 8 × 6 + 9?", 57], ["What is 7 × 9 + 8?", 71]];
  const [q, ans] = QS[Math.floor(Math.random() * QS.length)];
  setTimeout(() => {
    kvSet("bf_rate_last", String(Date.now()));
    const g = document.createElement("div");
    g.className = "rate-gate"; g.id = "rate-gate";
    g.innerHTML = `<div class="rate-card" role="dialog" aria-modal="true" aria-labelledby="rate-h">
      <h3 id="rate-h">For grown-ups</h3>
      <p>Would you rate Brainforest? Answer this first.</p>
      <p><b>${q}</b></p>
      <input id="rate-ans" type="number" inputmode="numeric" aria-label="Answer">
      <div class="rate-row">
        <button class="rate-no" id="rate-no">Not now</button>
        <button class="rate-ok" id="rate-ok">Rate</button>
      </div></div>`;
    document.body.appendChild(g);
    const close = () => g.remove();
    document.getElementById("rate-no").addEventListener("click", close);
    document.getElementById("rate-ok").addEventListener("click", () => {
      const ok = Number(document.getElementById("rate-ans").value) === ans;
      close();
      if (ok) { try { bridge.postMessage({ cmd: "ask" }); } catch (_) {} }
    });
  }, 1200);
})();
</script>
</body>
</html>
